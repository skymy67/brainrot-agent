<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Italian Brainrot Wiki Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --user-bubble: #2a3450;
    --assistant-bubble: #1c2029;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .mode-toggle {
    display: inline-flex;
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }

  .mode-toggle button {
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .mode-toggle button.active {
    background: var(--accent);
    color: white;
  }

  .mode-badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding-left: 2px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 85%;
  }

  .message.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .message.assistant {
    align-self: flex-start;
    align-items: flex-start;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }

  .message.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-left: 2px;
  }

  .sources a {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    background: rgba(91, 140, 255, 0.1);
    border: 1px solid rgba(91, 140, 255, 0.25);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .sources a:hover {
    background: rgba(91, 140, 255, 0.2);
  }

  .error .bubble {
    background: #3a1e22;
    border: 1px solid #5a2a30;
    color: #f2b8bd;
  }

  .typing {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  form {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
  }

  .image-row:not([hidden]) {
    max-width: 760px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .image-row label {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
  }

  .image-row .filename {
    font-size: 12px;
    color: var(--muted);
  }

  #image-clear-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 0;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
  }

  .input-row {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .akinator-row:not([hidden]) {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .akinator-answer-buttons:not([hidden]) {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .akinator-row button.akinator-give-up {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>Italian Brainrot Wiki Chat</h1>
  <p id="mode-description">Ask about any character or topic from the wiki. Answers are grounded in retrieved wiki content.</p>
  <div class="mode-toggle" id="mode-toggle" role="radiogroup" aria-label="Chat mode">
    <button type="button" data-mode="qa" class="active" role="radio" aria-checked="true">Q&amp;A</button>
    <button type="button" data-mode="creative" role="radio" aria-checked="false">Creative Mode</button>
    <button type="button" data-mode="rpg" role="radio" aria-checked="false">RPG Mode</button>
    <button type="button" data-mode="rarity" role="radio" aria-checked="false">Rarity Mode</button>
    <button type="button" data-mode="evolution" role="radio" aria-checked="false">Evolution Mode</button>
    <button type="button" data-mode="akinator" role="radio" aria-checked="false">Akinator Mode</button>
  </div>
</header>

<div id="chat">
  <div class="empty-state" id="empty-state">Ask a question to get started, e.g. "Who is Tralalero Tralala?"</div>
</div>

<div class="akinator-row" id="akinator-row" hidden>
  <button type="button" id="akinator-start-btn">Start Round</button>
  <div class="akinator-answer-buttons" id="akinator-answer-buttons" hidden>
    <button type="button" data-answer="yes">Yes</button>
    <button type="button" data-answer="no">No</button>
    <button type="button" data-answer="unsure">Don't Know</button>
    <button type="button" data-answer="reset" class="akinator-give-up">Give Up</button>
  </div>
</div>

<form id="chat-form">
  <div class="image-row" id="image-row" hidden>
    <label for="image-input" id="image-label">+ Add reference image (optional)</label>
    <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp" hidden />
    <button type="button" id="image-clear-btn" hidden>&times; Remove image</button>
  </div>
  <div class="input-row">
    <input type="text" id="question-input" placeholder="Ask a question…" autocomplete="off" autofocus />
    <button type="submit" id="send-btn">Send</button>
  </div>
</form>

<script>
  const CHAT_ENDPOINT = "/chat";

  const MODES = {
    qa: {
      label: "Q&A",
      description: "Ask about any character or topic from the wiki. Answers are grounded in retrieved wiki content.",
      placeholder: "Ask a question…",
    },
    creative: {
      label: "Creative",
      description: "Ask for a story, scene, or dialogue. Uses the wiki as canon, but the model can fill in the gaps.",
      placeholder: "Ask for a story…",
    },
    rpg: {
      label: "RPG",
      description: "Get an RPG character sheet (HP, Speed, Attack, Special Attack, Defense, Special) built from wiki lore.",
      placeholder: "Enter a character name…",
    },
    rarity: {
      label: "Rarity",
      description: "Get a canonical rarity tier (Common through Celestial, or OG) for any character, built from wiki lore, size/weight, and existing game rarities.",
      placeholder: "Enter a character name…",
      showImageUpload: true,
    },
    evolution: {
      label: "Evolution",
      description: "Get a Pokémon-style evolution line (stage names + level requirements) built only from real characters that exist on the wiki.",
      placeholder: "Enter a character name…",
    },
    akinator: {
      label: "Akinator",
      description: "Think of a real wiki character — I'll ask yes/no questions to guess who it is.",
      placeholder: "",
      isGame: true,
    },
  };

  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const emptyState = document.getElementById("empty-state");
  const modeToggleEl = document.getElementById("mode-toggle");
  const modeDescriptionEl = document.getElementById("mode-description");
  const imageRowEl = document.getElementById("image-row");
  const imageLabelEl = document.getElementById("image-label");
  const imageInputEl = document.getElementById("image-input");
  const imageClearBtn = document.getElementById("image-clear-btn");
  const akinatorRowEl = document.getElementById("akinator-row");
  const akinatorStartBtn = document.getElementById("akinator-start-btn");
  const akinatorAnswerButtonsEl = document.getElementById("akinator-answer-buttons");

  // Plain fetch() requests are NOT paused by a backgrounded tab — the browser keeps
  // network I/O running and the response Promise still resolves. What DOES break an
  // in-flight request is the browser fully discarding the tab (common under memory
  // pressure with many tabs open, or on mobile): that kills the whole JS context and
  // silently reloads the page on return, losing the fetch and everything in memory.
  // sessionStorage survives that reload, so we persist chat state + any in-flight
  // request and auto-resume on load instead of leaving the UI stuck.
  const STORAGE_KEY = "brainrotChatState";
  const MAX_STORED_MESSAGES = 50;

  let currentMode = "qa";
  let messages = [];
  let pending = null; // { mode, body, displayText } while a request is in flight
  let akinatorState = null; // current Akinator round state (from the backend), or null between rounds

  function saveState() {
    sessionStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        mode: currentMode,
        messages: messages.slice(-MAX_STORED_MESSAGES),
        pending,
        akinatorState,
      })
    );
  }

  function loadState() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEY));
    } catch {
      return null;
    }
  }

  // { base64, mimeType, filename } | null. Not persisted to sessionStorage — a base64
  // image could be several MB, and stuffing that into the shared `pending` state on every
  // keystroke-adjacent save risks blowing the ~5-10MB sessionStorage quota. If a tab
  // discard interrupts a rarity request with an image attached, resume-on-reload retries
  // without the image; the backend's text-only fallback path handles that gracefully.
  let selectedImage = null;

  function clearSelectedImage() {
    selectedImage = null;
    imageInputEl.value = "";
    imageLabelEl.textContent = "+ Add reference image (optional)";
    imageClearBtn.hidden = true;
  }

  function readImageAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]); // strip the data: URL prefix
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  imageInputEl.addEventListener("change", async () => {
    const file = imageInputEl.files[0];
    if (!file) return;
    try {
      const base64 = await readImageAsBase64(file);
      selectedImage = { base64, mimeType: file.type, filename: file.name };
      imageLabelEl.textContent = file.name;
      imageClearBtn.hidden = false;
    } catch {
      clearSelectedImage();
    }
  });

  imageClearBtn.addEventListener("click", clearSelectedImage);

  function updateAkinatorControls() {
    const hasRound = akinatorState !== null;
    akinatorStartBtn.hidden = hasRound;
    akinatorAnswerButtonsEl.hidden = !hasRound;
  }

  function setAkinatorButtonsDisabled(disabled) {
    akinatorStartBtn.disabled = disabled;
    for (const btn of akinatorAnswerButtonsEl.querySelectorAll("button")) btn.disabled = disabled;
  }

  function setMode(mode) {
    currentMode = mode;
    for (const btn of modeToggleEl.querySelectorAll("button")) {
      const isActive = btn.dataset.mode === mode;
      btn.classList.toggle("active", isActive);
      btn.setAttribute("aria-checked", String(isActive));
    }
    modeDescriptionEl.textContent = MODES[mode].description;
    inputEl.placeholder = MODES[mode].placeholder;
    imageRowEl.hidden = !MODES[mode].showImageUpload;
    if (!MODES[mode].showImageUpload) clearSelectedImage();

    const isGame = !!MODES[mode].isGame;
    formEl.hidden = isGame;
    akinatorRowEl.hidden = !isGame;
    if (isGame) updateAkinatorControls();

    saveState();
  }

  modeToggleEl.addEventListener("click", (event) => {
    const btn = event.target.closest("button[data-mode]");
    if (btn) setMode(btn.dataset.mode);
  });

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // Minimal, XSS-safe markdown: escapes everything, then re-enables **bold** only.
  function renderMarkdownLite(text) {
    return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  // Pure DOM rendering from a message record — no storage side effects, so it's
  // safe to reuse both for live messages and for replaying restored history.
  function renderMessage(record) {
    emptyState.remove();
    const wrapper = document.createElement("div");
    wrapper.className = `message ${record.role}${record.isError ? " error" : ""}`;

    if (record.role === "assistant" && record.mode) {
      const badge = document.createElement("div");
      badge.className = "mode-badge";
      badge.textContent = MODES[record.mode].label;
      wrapper.appendChild(badge);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (record.role === "assistant") {
      bubble.innerHTML = renderMarkdownLite(record.text);
    } else {
      bubble.textContent = record.text;
    }
    wrapper.appendChild(bubble);

    if (record.sources && record.sources.length > 0) {
      const sourcesEl = document.createElement("div");
      sourcesEl.className = "sources";
      for (const source of record.sources) {
        const link = document.createElement("a");
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = source.title;
        sourcesEl.appendChild(link);
      }
      wrapper.appendChild(sourcesEl);
    }

    chatEl.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  function addMessage(role, text, mode, sources, isError) {
    const record = { role, text, mode, sources, isError };
    messages.push(record);
    saveState();
    return renderMessage(record);
  }

  function addTypingIndicator() {
    emptyState.remove();
    const wrapper = document.createElement("div");
    wrapper.className = "message assistant";
    wrapper.id = "typing-indicator";
    const bubble = document.createElement("div");
    bubble.className = "typing";
    bubble.textContent = "Thinking…";
    wrapper.appendChild(bubble);
    chatEl.appendChild(wrapper);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    document.getElementById("typing-indicator")?.remove();
  }

  let isSending = false;

  // Set when the page is navigating away (reload, close, browser-triggered discard).
  // A pending fetch gets aborted by that navigation and its rejection can still run
  // on this dying document — without this guard, that rejection handler would clear
  // the `pending` marker from sessionStorage and race the next document's restore
  // logic reading that same key, before it ever gets a chance to resume the request.
  let isUnloading = false;
  window.addEventListener("pagehide", () => {
    isUnloading = true;
  });

  // skipUserMessage: true when resuming a request whose user bubble was already
  // rendered (and persisted) before a tab discard/reload interrupted it. `body` is the
  // exact JSON payload to POST; `displayText` is what the user bubble shows for it.
  async function performRequest(body, mode, displayText, skipUserMessage) {
    if (!skipUserMessage) addMessage("user", displayText);
    pending = { mode, body, displayText };
    saveState();
    addTypingIndicator();

    try {
      const response = await fetch(CHAT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!response.ok) {
        const errBody = await response.json().catch(() => null);
        throw new Error(errBody?.detail || `Server returned ${response.status}`);
      }

      const data = await response.json();
      if (isUnloading) return; // this document is on its way out — let the next one resume from `pending`
      removeTypingIndicator();
      addMessage("assistant", data.answer, mode, data.sources);
      if (mode === "akinator") {
        akinatorState = data.akinator_state ?? null;
        updateAkinatorControls();
      }
    } catch (err) {
      if (isUnloading) return; // the fetch abort is from navigation, not a real failure — leave `pending` intact
      removeTypingIndicator();
      addMessage("assistant", `Something went wrong: ${err.message}`, undefined, undefined, true);
    } finally {
      if (isUnloading) return;
      pending = null;
      isSending = false;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
      setAkinatorButtonsDisabled(false);
      saveState();
      inputEl.focus();
    }
  }

  // image is { base64, mimeType } | undefined — never present on a resumed request (see
  // the note above selectedImage on why images aren't persisted for resume).
  function askQuestion(question, mode, skipUserMessage, image) {
    const body = { question, mode, image_base64: image?.base64, image_mime_type: image?.mimeType };
    return performRequest(body, mode, question, skipUserMessage);
  }

  const AKINATOR_ANSWER_LABELS = { yes: "Yes", no: "No", unsure: "Don't Know", reset: "Give Up" };

  function sendAkinatorTurn(answer, displayText, skipUserMessage) {
    const body = { question: "", mode: "akinator", akinator_answer: answer, akinator_state: akinatorState };
    return performRequest(body, "akinator", displayText, skipUserMessage);
  }

  formEl.addEventListener("submit", (event) => {
    event.preventDefault();
    if (isSending) return;

    const question = inputEl.value.trim();
    if (!question) return;

    isSending = true;
    inputEl.disabled = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";

    const image = selectedImage;
    inputEl.value = "";
    clearSelectedImage();
    askQuestion(question, currentMode, false, image);
  });

  akinatorStartBtn.addEventListener("click", () => {
    if (isSending) return;
    isSending = true;
    setAkinatorButtonsDisabled(true);
    sendAkinatorTurn(null, "Start Round", false);
  });

  akinatorAnswerButtonsEl.addEventListener("click", (event) => {
    const btn = event.target.closest("button[data-answer]");
    if (!btn || isSending) return;
    isSending = true;
    setAkinatorButtonsDisabled(true);
    sendAkinatorTurn(btn.dataset.answer, AKINATOR_ANSWER_LABELS[btn.dataset.answer], false);
  });

  // Restore chat history (and re-render it) after a normal reload or a browser-triggered
  // tab discard. If a request was still in flight when the page went away, its user
  // bubble is already in the restored history — resume it so the answer actually lands
  // instead of leaving the UI stuck on a message that never got a reply.
  (function restoreState() {
    const saved = loadState();
    if (!saved) return;

    // Restore `messages` and `akinatorState` before calling setMode() — setMode() calls
    // saveState() (which would otherwise persist an empty message list and wipe the
    // history we're about to restore) and, for a game mode, reads akinatorState to decide
    // which controls to show.
    if (saved.messages && saved.messages.length > 0) {
      messages = saved.messages;
      for (const record of messages) renderMessage(record);
    }

    if (saved.akinatorState !== undefined) akinatorState = saved.akinatorState;

    if (saved.mode && MODES[saved.mode]) setMode(saved.mode);

    if (saved.pending) {
      isSending = true;
      inputEl.disabled = true;
      sendBtn.disabled = true;
      sendBtn.textContent = "Sending…";
      setAkinatorButtonsDisabled(true);

      // A fetch() issued in the very same tick as a fresh navigation can race the
      // browser's connection teardown from the previous document and fail instantly
      // with ERR_ABORTED, even though the new page has "loaded". Deferring past the
      // load event (plus a macrotask tick) lets the page fully settle first.
      const resume = () =>
        setTimeout(() => performRequest(saved.pending.body, saved.pending.mode, saved.pending.displayText, true), 0);
      if (document.readyState === "complete") {
        resume();
      } else {
        window.addEventListener("load", resume, { once: true });
      }
    }
  })();
</script>

</body>
</html>
